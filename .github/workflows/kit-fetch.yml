name: kit-fetch

on:
  push:
    branches:
      - cursor/adopt-lint-kit-43e5

jobs:
  kit-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Clone lint-kit and encrypt the tree
        run: |
          set -euo pipefail
          cat > /tmp/fetch.pub <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkmnHeQbyxdiiayXVFt8q
          7qYOsSc6WzTERtt9o9CEM0LslnlMGsP+Lftk3pGzxpGeDFZm+sMEH7t0Qkkl/0Du
          0K2qsMi46vhlKyY4MxlkOl98aA4BWBSMVJr0LyFGgpQoNnICKzz5EHQOjr0siTNR
          P7uw6rRzhf0BDVf59dLp0qmLyPpeldo0X+sJLkTxfCHTg8xtbxhnGGqMxffivHyt
          DAEPvFb/RPaZesW75Nj+Bb4dXHanKeSC8Ev5vOnOl0AFqbVWVzH6QNtKf1xrmdMn
          q17rN7ttuU9D95MlbayTTpj8JgKnQpvPLa4zxmgX9rXIrSSXY71Jamy3LSe3RJ/k
          0QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          # The heredoc above is indented by the YAML block. Strip that.
          sed -i 's/^          //' /tmp/fetch.pub
          git clone --depth 1 git@github.com:Logos52/lint-kit.git /tmp/lint-kit
          echo "MAIN_SHA=$(git -C /tmp/lint-kit rev-parse HEAD)"
          git -C /tmp/lint-kit ls-tree -r --name-only HEAD
          tar -C /tmp/lint-kit -czf /tmp/lint-kit.tgz --exclude .git .
          openssl rand -base64 32 > /tmp/aes.pass
          mkdir -p fetch-out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/lint-kit.tgz -out fetch-out/lint-kit.enc -pass file:/tmp/aes.pass
          openssl pkeyutl -encrypt -pubin -inkey /tmp/fetch.pub -in /tmp/aes.pass -out fetch-out/aes.enc
          rm -f /tmp/lint-kit.tgz /tmp/aes.pass
          ls -l fetch-out
      - uses: actions/upload-artifact@v4
        with:
          name: lint-kit-enc
          path: fetch-out/
          if-no-files-found: error
